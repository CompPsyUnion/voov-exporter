name: CI and PyPI Release

on:
  push:
    branches:
      - main
    tags:
      - "v[0-9]*.[0-9]*.[0-9]*"
  pull_request:
    branches:
      - main

jobs:
  verify-matrix:
    name: Build & Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: true
      matrix:
        os: [ubuntu-latest]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate release tag belongs to main and matches package version
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          if ! git merge-base --is-ancestor "${GITHUB_SHA}" origin/main; then
            echo "::error::Tag ${GITHUB_REF_NAME} (${GITHUB_SHA}) is not on branch 'main'. Aborting release."
            exit 1
          fi

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check tag version consistency
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          set -euo pipefail
          TAG_VER="${GITHUB_REF_NAME#v}"
          PKG_VER="$(python -c "import tomllib, voov_exporter; d=tomllib.load(open('pyproject.toml','rb')); assert d['project']['version']==voov_exporter.__version__, (d['project']['version'], voov_exporter.__version__); print(d['project']['version'])")"
          if [ "${TAG_VER}" != "${PKG_VER}" ]; then
            echo "::error::Tag version (${TAG_VER}) does not match package version (${PKG_VER})."
            exit 1
          fi
          echo "Verified release version: ${PKG_VER}"

      - name: Install FFmpeg (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          
      - name: Build sdist & wheel and validate metadata
        shell: bash
        run: |
          python -m pip install --upgrade pip build twine
          python -m build
          twine check dist/*

      - name: Install built wheel and verify CLI entrypoint
        shell: bash
        run: |
          python -m pip install --force-reinstall dist/*.whl
          TMP_CHECK_DIR="$(mktemp -d)"
          (
            cd "${TMP_CHECK_DIR}"
            voov-exporter --version
            voov-exporter --help
          )
          rm -rf "${TMP_CHECK_DIR}"

      - name: Run test suite
        shell: bash
        run: python -m unittest discover -s tests -v

  publish-pypi:
    name: Publish to PyPI
    needs: verify-matrix
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    environment:
      name: voov-exporter
      url: https://pypi.org/p/voov-exporter
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build distribution artifacts
        run: |
          python -m pip install --upgrade pip build twine
          python -m build
          twine check dist/*

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
